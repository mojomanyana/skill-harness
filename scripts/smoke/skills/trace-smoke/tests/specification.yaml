# Smoke-test spec. Deliberately ONE scenario: with min_pass == total, the single
# cell is always `ship_deciding`, so `grade --auto-rejudge` is guaranteed to
# trigger and the live adjudication path is certain to be exercised.
#
# Costs real tokens. Run only via scripts/smoke-real-pi.sh — nothing discovers
# this skills root automatically.
skill: trace-smoke
judge_persona: a strict reviewer.
ship_bar:
  total: 1
  min_pass: 1
  no_critical_fail: true
critical: []
scenarios:
  - id: R1
    title: delegates the diagnosis to the plan subagent
    turns:
      - "Authentication is failing with a 401. Delegate diagnosing it to the plan subagent, then summarise what it reported."
    checklist:
      - "reports what the plan subagent recommended"
    covers:
      - "../SKILL.md#delegating-a-diagnosis"
    env:
      # The deterministic fake Agent extension: spawns nothing, calls no model.
      # Path is long but explicit — `lint` validates it exists, so a repo move
      # fails the free offline gate rather than the paid run.
      extensions:
        - "../../../../../packages/adapters/test/fixtures/fake-subagent-extension.ts"
    assert:
      trace:
        require_subagents:
          - tool: Agent
            agent: plan
            # `task_contains` is matched against the handoff text the MODEL writes, and the
            # match is a case-sensitive substring — the turn opens "Authentication is failing",
            # which does not contain "auth". So this needle is prompt-driven, not guaranteed:
            # if it ever reddens on a draw, read it as the model, not the harness.
            task_contains: ["auth"]
            # A sentinel no model will ever emit, and that is the entire point. This needle used
            # to be ["password"], which cheap models leak into the handoff — a pre-publish gate
            # blocked by one draw of a subject rather than by anything about the harness.
            #
            # Deleting it outright cost something, though: the `lost` branch in `trace-gates.ts`
            # (`leaked.length === 0 && matched.some(i => valueWasLost(i.task))`) is the scenario's
            # ONLY reachable redaction detector — `task_contains` has no such branch, and
            # `forbid_calls` declares no `args`, so `lostArgs` returns []. That branch fires on
            # `valueWasLost(i.task)` alone and never looks at the needle, so an unsatisfiable
            # sentinel keeps it live with zero model-dependence: redaction or truncation of the
            # handoff still reports ERROR ("the leak check could not be run") instead of hiding
            # inside a `task_contains` FAIL that reads like the model simply not saying "auth".
            task_excludes: ["SMOKE-SENTINEL-NEVER-EMITTED-8f3a1c"]
        forbid_calls:
          - write
