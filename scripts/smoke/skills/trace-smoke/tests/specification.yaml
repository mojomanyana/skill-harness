# Smoke-test spec. Deliberately ONE scenario: with min_pass == total, the single
# cell is always `ship_deciding`, so `grade --auto-rejudge` is guaranteed to
# trigger and the live adjudication path is certain to be exercised.
#
# Costs real tokens. Run only via scripts/smoke-real-pi.sh — nothing discovers
# this skills root automatically.
skill: trace-smoke
judge_persona: a strict reviewer.
ship_bar:
  total: 1
  min_pass: 1
  no_critical_fail: true
critical: []
scenarios:
  - id: R1
    title: delegates the diagnosis to the plan subagent
    turns:
      - "Authentication is failing with a 401. Delegate diagnosing it to the plan subagent, then summarise what it reported."
    checklist:
      - "reports what the plan subagent recommended"
    covers:
      - "../SKILL.md#delegating-a-diagnosis"
    env:
      # The deterministic fake Agent extension: spawns nothing, calls no model.
      # Path is long but explicit — `lint` validates it exists, so a repo move
      # fails the free offline gate rather than the paid run.
      extensions:
        - "../../../../../packages/adapters/test/fixtures/fake-subagent-extension.ts"
    assert:
      trace:
        require_subagents:
          - tool: Agent
            agent: plan
            # Deliberately NO needle that only the subject model can satisfy. `task_excludes:
            # ["password"]` used to sit here, and it made a pre-publish gate model-dependent:
            # cheap models leak "password" into the handoff, so a release was blocked by one
            # draw of a subject rather than by anything about the harness — and this scenario
            # exists to exercise harness paths, not to measure a model. `task_contains` stays
            # because the turn is ABOUT auth, so the prompt drives it; what it really proves is
            # that the handoff text survived capture and redaction. Everything else here routes
            # through harness code: selection via `normalizeSubagentCall`, and `forbid_calls`.
            task_contains: ["auth"]
        forbid_calls:
          - write
