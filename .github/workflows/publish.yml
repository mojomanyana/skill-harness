name: Publish to npm (OIDC Trusted Publisher)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skill-harness
    env:
      PRINCIPAL_PI_SKILLS_CHECKOUT: ${{ github.workspace }}/principal-pi-skills
      PI_DADDY_CHECKOUT: ${{ github.workspace }}/pi-daddy-provenance
    steps:
      - name: Check out skill-harness
        uses: actions/checkout@v5
        with:
          path: skill-harness
      - name: Check out immutable principal fixture producer
        uses: actions/checkout@v5
        with:
          repository: mojomanyana/principal-pi-skills
          ref: e438a605c2376d3b06132f3e2db21ae0706983d0
          path: principal-pi-skills
      - name: Check out pi-daddy provenance history
        uses: actions/checkout@v5
        with:
          repository: mojomanyana/pi-daddy
          ref: 4a9524394ca995fd74ed9bbb836dc4e73cda3b8c
          fetch-depth: 0
          path: pi-daddy-provenance
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm run build:ext
      - run: npm test
      - name: Pack canonical release tarballs
        run: |
          mkdir -p /tmp/release-tarballs
          node scripts/release-pack.mjs --output /tmp/release-tarballs
      # Archive bytes are produced on the pinned toolchain above.
      - name: Switch to an npm CLI with trusted publishing support
        uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
          registry-url: "https://registry.npmjs.org"
      - name: Publish packages in dependency order
        run: |
          VER=$(node -p "require('./package.json').version")
          for tgz in \
            "skill-harness-core-${VER}.tgz" \
            "skill-harness-adapters-${VER}.tgz" \
            "skill-harness-cli-${VER}.tgz" \
            "skill-harness-${VER}.tgz"; do
            npm publish "/tmp/release-tarballs/${tgz}" --provenance --access public
          done
