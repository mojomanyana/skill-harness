name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pi-current-transport:
    name: Pi 1.6.1 scripted transport
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install the exact Pi runtime in isolation
        run: npm install --prefix "$RUNNER_TEMP/pi161" --no-save --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.6.1
      - name: Exercise native Pi and the Harness adapter with scripted local answers
        shell: bash
        run: |
          set -o pipefail
          node scripts/pi-qualification/capture.mjs 1.6.1 "$RUNNER_TEMP/pi161" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pi161-native" native 2>&1 | tee "$RUNNER_TEMP/pi161-native.log"
          node scripts/pi-qualification/capture.mjs 1.6.1 "$RUNNER_TEMP/pi161" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pi161-adapter" adapter 2>&1 | tee "$RUNNER_TEMP/pi161-adapter.log"
      - name: Retain qualification summaries and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-1.6.1-transport
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/pi161-native.log
            ${{ runner.temp }}/pi161-adapter.log
            ${{ runner.temp }}/pi161-native/qualification.json
            ${{ runner.temp }}/pi161-native/processes.json
            ${{ runner.temp }}/pi161-native/network.json
            ${{ runner.temp }}/pi161-native/*.log
            ${{ runner.temp }}/pi161-native/*.stderr.txt
            ${{ runner.temp }}/pi161-adapter/qualification.json
            ${{ runner.temp }}/pi161-adapter/processes.json
            ${{ runner.temp }}/pi161-adapter/network.json
            ${{ runner.temp }}/pi161-adapter/*.log

  pi-daddy-record-v1-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out skill-harness
        uses: actions/checkout@v5
        with:
          path: skill-harness
      - name: Check out pinned pi-daddy contract producer
        uses: actions/checkout@v5
        with:
          repository: mojomanyana/pi-daddy
          ref: 9c9cdaeadf593983954ad5a2d4de38233afa895c
          path: pi-daddy
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: skill-harness/package-lock.json
      - name: Install skill-harness dependencies
        run: npm ci
        working-directory: skill-harness
      - name: Check deterministic record-v1 contract vendoring
        run: node scripts/vendor-pi-daddy-record-v1-contract.mjs ../pi-daddy --check
        working-directory: skill-harness

  build-test:
    needs: [pi-daddy-record-v1-contract]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skill-harness
    env:
      PRINCIPAL_PI_SKILLS_CHECKOUT: ${{ github.workspace }}/principal-pi-skills
      PI_DADDY_CHECKOUT: ${{ github.workspace }}/pi-daddy-provenance
    steps:
      - name: Check out skill-harness
        uses: actions/checkout@v5
        with:
          path: skill-harness
      - name: Check out immutable principal fixture producer
        uses: actions/checkout@v5
        with:
          repository: mojomanyana/principal-pi-skills
          ref: e438a605c2376d3b06132f3e2db21ae0706983d0
          path: principal-pi-skills
      - name: Check out pi-daddy provenance history
        uses: actions/checkout@v5
        with:
          repository: mojomanyana/pi-daddy
          ref: 9c9cdaeadf593983954ad5a2d4de38233afa895c
          fetch-depth: 0
          path: pi-daddy-provenance
      - uses: actions/setup-node@v5
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: skill-harness/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify committed Pi extension bundle is source-fresh without rewriting it
        run: npm run check:ext
      - run: npm run typecheck
      - name: Reproduce, install, and smoke-test canonical release archives
        run: npm run smoke:packed
  dogfood-lint:
    needs: [pi-daddy-record-v1-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint the golden fixture via the composite action
        uses: ./
        with:
          skills-root: packages/core/test/fixtures
          skill: all
      - name: Lint the real-pi smoke spec
        uses: ./
        with:
          skills-root: scripts/smoke/skills
          skill: all
