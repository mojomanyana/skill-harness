name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pi-daddy-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out skill-harness
        uses: actions/checkout@v5
        with:
          path: skill-harness
      - name: Check out immutable pi-daddy contract producer
        uses: actions/checkout@v5
        with:
          repository: mojomanyana/pi-daddy
          ref: c364a6717e3d5e369ecd3298b9cbb595eb94d9b2
          path: pi-daddy
      # pi-daddy's pinned package requires Node >=22.19; Node 24 is also supported
      # by skill-harness. The ordinary skill-harness suite remains authoritative on 20 below.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            skill-harness/package-lock.json
            pi-daddy/package-lock.json
      - name: Install skill-harness dependencies
        run: npm ci
        working-directory: skill-harness
      - name: Install pi-daddy dependencies
        run: npm ci
        working-directory: pi-daddy
      - name: Check deterministic vendored contract generation
        run: node scripts/vendor-pi-daddy-contract.mjs ../pi-daddy c364a6717e3d5e369ecd3298b9cbb595eb94d9b2 10 --check
        working-directory: skill-harness
      - name: Verify real pi-daddy builders against the pinned adapter
        run: npm run verify:pi-daddy-contract -- ../pi-daddy
        working-directory: skill-harness

  pi-daddy-ledger-v3-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out skill-harness
        uses: actions/checkout@v5
        with:
          path: skill-harness
      - name: Check out immutable pi-daddy ledger-v3 producer
        uses: actions/checkout@v5
        with:
          repository: mojomanyana/pi-daddy
          ref: 591abb4a358bf8a84455486812b83609e2a47e3f
          path: pi-daddy-v3
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            skill-harness/package-lock.json
            pi-daddy-v3/package-lock.json
      - name: Install skill-harness dependencies
        run: npm ci
        working-directory: skill-harness
      - name: Install pi-daddy dependencies
        run: npm ci
        working-directory: pi-daddy-v3
      - name: Check deterministic ledger-v3 vendoring
        run: node scripts/vendor-pi-daddy-ledger-v3-contract.mjs ../pi-daddy-v3 591abb4a358bf8a84455486812b83609e2a47e3f --check
        working-directory: skill-harness
      - name: Verify real ledger-v3 production builders
        run: npm run verify:pi-daddy-v3-contract -- ../pi-daddy-v3
        working-directory: skill-harness
      - name: Check built ledger-v3 adapter directly
        run: node scripts/check-pi-daddy-v3-contract.mjs
        working-directory: skill-harness

  build-test:
    needs: [pi-daddy-contract, pi-daddy-ledger-v3-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20.20.2"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - name: Reproduce canonical release archives
        run: npm run release:pack -- --output "$RUNNER_TEMP/skill-harness-release"
  dogfood-lint:
    needs: [pi-daddy-contract, pi-daddy-ledger-v3-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint the golden fixture via the composite action
        uses: ./
        with:
          skills-root: packages/core/test/fixtures
          skill: all
      # The smoke spec claims `lint` validates its declared extension path, but the only thing
      # that ran that lint was the token-spending script — so a repo move broke the pre-publish
      # gate and you found out by spending. A fresh checkout has no `tests/results/`, so the
      # staleness findings that fire locally cannot fire here.
      - name: Lint the real-pi smoke spec
        uses: ./
        with:
          skills-root: scripts/smoke/skills
          skill: all
